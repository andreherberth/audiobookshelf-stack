# Coolify 4.5+ Object Storage FUSE mount (S3) + Audiobookshelf.
#
# Build pack: Docker Compose
# Docker Compose location: /compose.coolify.yml
# Raw Compose: leave off. Coolify 4.5 keeps privileged, /dev/fuse, and bind propagation.
# Domain: Coolify Domains UI on the audiobookshelf service (internal port 80).
#
# In Audiobookshelf → Settings → Libraries → Add Library, use folder:
#   /audiobooks   (books)
#   /podcasts     (podcasts)
#   /ebooks       (ebooks)
#
# Create those prefixes in the S3 bucket first.
# create_host_path: false keeps a redeploy from replacing a live FUSE mount with an empty directory.

x-rclone-env: &rclone-env
  RCLONE_CONFIG_HETZNER_TYPE: s3
  RCLONE_CONFIG_HETZNER_PROVIDER: Hetzner
  RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
  RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
  RCLONE_CONFIG_HETZNER_ENDPOINT: ${S3_ENDPOINT:?}
  RCLONE_CONFIG_HETZNER_REGION: ${S3_REGION:-fsn1}
  S3_BUCKET: ${S3_BUCKET:?}
  VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
  VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
  VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
  VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-security: &rclone-security
  privileged: true
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined

services:
  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: audiobooks
      RCLONE_MOUNT_PATH: /mnt/audiobooks
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        remote="hetzner:$$S3_BUCKET/$$RCLONE_REMOTE_SUBDIR"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --log-level INFO
    volumes:
      - rclone_cache:/cache
      - type: bind
        source: ./mnt/audiobooks
        target: /mnt/audiobooks
        bind:
          create_host_path: false
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/audiobooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-podcasts:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: podcasts
      RCLONE_MOUNT_PATH: /mnt/podcasts
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        remote="hetzner:$$S3_BUCKET/$$RCLONE_REMOTE_SUBDIR"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --log-level INFO
    volumes:
      - rclone_cache_podcasts:/cache
      - type: bind
        source: ./mnt/podcasts
        target: /mnt/podcasts
        bind:
          create_host_path: false
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/podcasts ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-ebooks:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ebooks
      RCLONE_MOUNT_PATH: /mnt/ebooks
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        remote="hetzner:$$S3_BUCKET/$$RCLONE_REMOTE_SUBDIR"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --log-level INFO
    volumes:
      - rclone_cache_ebooks:/cache
      - type: bind
        source: ./mnt/ebooks
        target: /mnt/ebooks
        bind:
          create_host_path: false
          propagation: rshared
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/ebooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      SERVICE_URL_AUDIOBOOKSHELF: ${SERVICE_URL_AUDIOBOOKSHELF:-}
    expose:
      - "80"
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        read_only: true
        bind:
          create_host_path: false
          propagation: rshared
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        read_only: true
        bind:
          create_host_path: false
          propagation: rshared
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        read_only: true
        bind:
          create_host_path: false
          propagation: rshared

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
