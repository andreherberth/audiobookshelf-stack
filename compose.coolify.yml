# Coolify-compatible stack: Object Storage FUSE mount (S3) + Audiobookshelf.
#
# In Coolify:
#   Build Pack: Docker Compose
#   Docker Compose Location: /compose.coolify.yml
#   Assign your domain to the "audiobookshelf" service
#
# No Coolify "content" file binds (they often become directories).
# fuse.conf is written at container start.
#
# If a previous deploy created fuse.conf/entrypoint.sh as directories, remove them:
#   rm -rf /data/coolify/applications/<uuid>/fuse.conf \
#          /data/coolify/applications/<uuid>/entrypoint.sh
#
# Libraries in ABS: /media/audiobooks, /media/podcasts, /media/ebooks

services:
  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    privileged: true
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: s3
      RCLONE_CONFIG_HETZNER_PROVIDER: Hetzner
      RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      RCLONE_CONFIG_HETZNER_ENDPOINT: ${S3_ENDPOINT:?}
      RCLONE_CONFIG_HETZNER_REGION: ${S3_REGION:-fsn1}
      S3_BUCKET: ${S3_BUCKET:?}
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
      VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
      VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
      VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        echo "rclone: mounting hetzner:$$S3_BUCKET -> /mnt/media"
        exec rclone mount "hetzner:$$S3_BUCKET" /mnt/media \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --log-level INFO
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    volumes:
      - rclone_cache:/cache
      - type: bind
        source: ./mnt/media
        target: /mnt/media
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/media ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/media
        target: /media
        read_only: true
        bind:
          propagation: rshared
        is_directory: true

volumes:
  rclone_cache:
  abs_config:
  abs_metadata:
