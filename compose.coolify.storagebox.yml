# Coolify-compatible stack: Storage Box FUSE mount (SFTP) + Audiobookshelf.
#
# In Coolify:
#   Build Pack: Docker Compose
#   Docker Compose Location: /compose.coolify.storagebox.yml
#   Assign your domain to the "audiobookshelf" service
#   Set STORAGEBOX_HOST / STORAGEBOX_USER / STORAGEBOX_PASS (plain password)
#
# One rclone mount of the Storage Box root (or STORAGEBOX_PATH). Point ABS
# libraries at /media/audiobooks, /media/podcasts, /media/ebooks.
#
# Host: /dev/fuse required. If ABS sees empty dirs after a healthy deploy:
#   sudo mount --make-rshared /data/coolify

services:
  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    privileged: true
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
      # Plain password — entrypoint runs `rclone obscure` (do not pre-obscure).
      STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
      RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
      RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    entrypoint: ["sh", "/entrypoint.sh"]
    command:
      - mount
      - hetzner:${STORAGEBOX_PATH:-}
      - /mnt/media
      - --allow-other
      - --allow-non-empty
      - --vfs-cache-mode
      - ${VFS_CACHE_MODE:-full}
      - --vfs-cache-max-size
      - ${VFS_CACHE_MAX_SIZE:-2G}
      - --vfs-cache-max-age
      - ${VFS_CACHE_MAX_AGE:-72h}
      - --cache-dir
      - /cache
      - --dir-cache-time
      - ${VFS_DIR_CACHE_TIME:-72h}
      - --checkers
      - "4"
      - --log-level
      - INFO
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    volumes:
      - rclone_cache:/cache
      - type: bind
        source: ./entrypoint.sh
        target: /entrypoint.sh
        content: |
          #!/bin/sh
          set -eu
          if [ -n "${STORAGEBOX_PASS:-}" ]; then
            export RCLONE_CONFIG_HETZNER_PASS
            RCLONE_CONFIG_HETZNER_PASS="$(rclone obscure "$STORAGEBOX_PASS")"
          fi
          echo "rclone-entrypoint: starting: rclone $*"
          exec rclone "$@"
      - type: bind
        source: ./fuse.conf
        target: /etc/fuse.conf
        content: |
          user_allow_other
      - type: bind
        source: ./mnt/media
        target: /mnt/media
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      # rclone image may not ship `mountpoint`; check /proc/mounts instead.
      test:
        [
          "CMD-SHELL",
          "grep -q ' /mnt/media ' /proc/mounts",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/media
        target: /media
        read_only: true
        bind:
          propagation: rshared
        is_directory: true
    # Coolify proxies container port 80 — assign a domain to this service.
    # Libraries: /media/audiobooks, /media/podcasts, /media/ebooks

volumes:
  rclone_cache:
  abs_config:
  abs_metadata:
