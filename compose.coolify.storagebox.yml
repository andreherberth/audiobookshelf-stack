# Coolify + Storage Box (SFTP FUSE) + Audiobookshelf
#
# Critical Coolify setting: enable "Raw Compose Deployment" if rclone is
# unhealthy / logs show fusermount3 Permission denied (Coolify may strip
# privileged, /dev/fuse, or security_opt).
#
# Required env:
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain password)
# Optional:
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
#
# Volume sources MUST be literal paths (Coolify rejects ${...} in bind sources).
# Coolify maps ./mnt → /data/coolify/applications/<uuid>/mnt at runtime.
#
# One-time on the Coolify host:
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
#   grep -q user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
#
# ABS libraries: /audiobooks /podcasts /ebooks

x-rclone-common: &rclone-common
  image: rclone/rclone:latest
  restart: unless-stopped
  privileged: true
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  environment: &rclone-env
    RCLONE_CONFIG_HETZNER_TYPE: sftp
    RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
    RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
    STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
    STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
    RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
    RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
    RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
    RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    RCLONE_CONFIG_HETZNER_KNOWN_HOSTS_FILE: none
    VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
    VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
    VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
    VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-health: &rclone-health
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 120s

services:
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          nsenter -t 1 -m -- mount --make-rshared "$$mp" \
            && echo "fuse-share: rshared OK -> $$mp" \
            || echo "fuse-share: FAILED $$mp"
        done
        nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf'
        echo "fuse-share: done"

  rclone:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      RCLONE_MOUNT_PATH: /mnt/audiobooks
    volumes:
      - rclone_cache:/cache
      # Literal ./mnt — Coolify forbids ${...} in volume sources
      - type: bind
        source: ./mnt/audiobooks
        target: /mnt/audiobooks
        bind:
          propagation: rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        if [ ! -e /dev/fuse ]; then
          echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
          exit 1
        fi
        ls -l /dev/fuse || true
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: probing $$remote"
        set +e
        probe_out="$$(rclone lsf "$$remote" --max-depth 1 2>&1)"
        probe_rc=$$?
        set -e
        echo "$$probe_out" | head -n 40
        if [ "$$probe_rc" -ne 0 ]; then
          echo "rclone: FATAL cannot access $$remote — check STORAGEBOX_HOST/USER/PASS/PATH/DIR"
          exit 1
        fi
        if [ -n "$$(ls -A "$$RCLONE_MOUNT_PATH" 2>/dev/null || true)" ]; then
          echo "rclone: WARNING $$RCLONE_MOUNT_PATH is not empty (local VPS shadow files)."
          echo "rclone: mounting with --allow-non-empty; clear host mnt if ABS still shows stale files:"
          echo "  sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete"
          ls -la "$$RCLONE_MOUNT_PATH" | head -n 20 || true
        fi
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    healthcheck:
      <<: *rclone-health
      test: ["CMD-SHELL", "grep -q ' /mnt/audiobooks ' /proc/mounts"]

  rclone-podcasts:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      RCLONE_MOUNT_PATH: /mnt/podcasts
    volumes:
      - rclone_cache_podcasts:/cache
      - type: bind
        source: ./mnt/podcasts
        target: /mnt/podcasts
        bind:
          propagation: rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        if [ ! -e /dev/fuse ]; then
          echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
          exit 1
        fi
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        rclone mkdir "$$remote" 2>/dev/null || true
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    healthcheck:
      <<: *rclone-health
      test: ["CMD-SHELL", "grep -q ' /mnt/podcasts ' /proc/mounts"]

  rclone-ebooks:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      RCLONE_MOUNT_PATH: /mnt/ebooks
    volumes:
      - rclone_cache_ebooks:/cache
      - type: bind
        source: ./mnt/ebooks
        target: /mnt/ebooks
        bind:
          propagation: rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        if [ ! -e /dev/fuse ]; then
          echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
          exit 1
        fi
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        rclone mkdir "$$remote" 2>/dev/null || true
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    healthcheck:
      <<: *rclone-health
      test: ["CMD-SHELL", "grep -q ' /mnt/ebooks ' /proc/mounts"]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        bind:
          propagation: rshared

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
