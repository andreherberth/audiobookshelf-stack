# Coolify + Storage Box (SFTP FUSE) + Audiobookshelf
# COMPOSE_MIN_COMMIT=b50d484 (fuse-share installs host rclone; no /proc copy)
#
# Host-namespace FUSE (nsenter) — in-container fusermount fails with
# "Permission denied" on Coolify bind paths under /data/coolify.
#
# Coolify Advanced: enable **Raw Compose Deployment** (required for FUSE).
#
# Required env:
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain password)
#   HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt
#   AUDIOBOOKSHELF_HOST=your.domain.or.sslip.io
# Optional:
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
# ABS library folders (inside container): /audiobooks /podcasts /ebooks
#
# Volume sources must be literal (Coolify rejects ${...} in sources).
#
# One-time on the Coolify host (fuse-share also applies AppArmor + fuse3 on deploy):
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
#   grep -q user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
# Ubuntu 25.04+: fusermount3 AppArmor needs /data/coolify/**/ + dac_override (see fuse-share).

x-rclone-common: &rclone-common
  image: rclone/rclone:1.69.1
  restart: unless-stopped
  privileged: true
  pid: host
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  environment: &rclone-env
    RCLONE_CONFIG_HETZNER_TYPE: sftp
    RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
    RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
    STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
    STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
    HOST_MNT_BASE: ${HOST_MNT_BASE:?set to /data/coolify/applications/<uuid>/mnt}
    RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
    RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
    RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
    RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
    VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
    VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
    VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-mount: &rclone-mount
  - |
    set -u
    echo "rclone: start subdir=$$RCLONE_HOST_SUBDIR script=v3-fuse-share-bin"
    if [ ! -e /dev/fuse ]; then
      echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
      sleep 30
      exit 1
    fi
    echo "user_allow_other" > /etc/fuse.conf

    export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
    remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
    # Match remote layout (media/audiobooks) so ABS sees libraries under /mnt/media/…
    host_path="$${HOST_MNT_BASE}/$${STORAGEBOX_PATH}$${RCLONE_HOST_SUBDIR}"
    app_dir="$$(dirname "$$HOST_MNT_BASE")"
    cache_dir="$${app_dir}/rclone-cache/$${RCLONE_HOST_SUBDIR}"
    bin_dir="$${app_dir}/bin"
    host_rclone="$$bin_dir/rclone"

    echo "rclone: remote=$$remote"
    echo "rclone: host_path=$$host_path"
    echo "rclone: host_rclone=$$host_rclone"

    while true; do
      if ! nsenter -t 1 -m -- test -x "$$host_rclone"; then
        echo "rclone: FATAL $$host_rclone missing — check fuse-share logs; retry in 20s"
        sleep 20
        continue
      fi

      echo "rclone: probing $$remote"
      if ! rclone lsf "$$remote" --max-depth 1 2>&1 | head -n 40; then
        echo "rclone: probe failed — check STORAGEBOX_* / folder names; retry in 20s"
        sleep 20
        continue
      fi
      rclone mkdir "$$remote" 2>/dev/null || true

      nsenter -t 1 -m -- mkdir -p "$$host_path" "$$cache_dir"

      fusermount_prog="$$(nsenter -t 1 -m -- sh -c 'command -v fusermount3 2>/dev/null || command -v fusermount 2>/dev/null || true')"
      if [ -z "$$fusermount_prog" ]; then
        echo "rclone: FATAL host fusermount missing — fuse-share should install fuse3; retry in 20s"
        sleep 20
        continue
      fi
      export FUSERMOUNT_PROG="$$fusermount_prog"
      echo "rclone: FUSERMOUNT_PROG=$$FUSERMOUNT_PROG"

      if ! nsenter -t 1 -m -- grep -q '^user_allow_other' /etc/fuse.conf 2>/dev/null; then
        echo "rclone: enabling user_allow_other in host /etc/fuse.conf"
        nsenter -t 1 -m -- sh -c 'echo user_allow_other >> /etc/fuse.conf' 2>/dev/null || true
      fi

      if nsenter -t 1 -m -- findmnt -M "$$host_path" >/dev/null 2>&1; then
        echo "rclone: unmounting stale FUSE at $$host_path"
        nsenter -t 1 -m -- "$$fusermount_prog" -uz "$$host_path" 2>/dev/null \
          || nsenter -t 1 -m -- umount -l "$$host_path" 2>/dev/null || true
        sleep 1
      elif [ -n "$$(nsenter -t 1 -m -- ls -A "$$host_path" 2>/dev/null || true)" ]; then
        echo "rclone: clearing local shadow files under $$host_path"
        nsenter -t 1 -m -- find "$$host_path" -mindepth 1 -delete 2>/dev/null || true
      fi

      echo "rclone: HOST mounting $$remote -> $$host_path"
      # nsenter -m: host mount namespace; FUSERMOUNT_PROG must be host fusermount (not container apk fuse3)
      nsenter -t 1 -m -- "$$host_rclone" mount "$$remote" "$$host_path" \
        --allow-other \
        --allow-non-empty \
        --vfs-cache-mode "$$VFS_CACHE_MODE" \
        --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
        --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
        --cache-dir "$$cache_dir" \
        --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
        --checkers 2 \
        --log-level INFO \
        || { echo "rclone: mount failed for $$host_path — retry in 20s"; sleep 20; }
    done

services:
  fuse-share:
    image: alpine:3.20
    # One-shot init: Exited (0) after "fuse-share: done" is expected — not an error
    restart: "no"
    privileged: true
    pid: host
    environment:
      HOST_MNT_BASE: ${HOST_MNT_BASE:?}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "fuse-share: start script=v3-fuse-share-bin"
        apk add --no-cache util-linux curl unzip ca-certificates >/dev/null
        app_dir="$$(dirname "$$HOST_MNT_BASE")"
        bin_dir="$${app_dir}/bin"
        nsenter -t 1 -m -- mkdir -p "$$bin_dir"
        # Only ensure parent mnt/ exists; subdirs may already be FUSE mounts from a prior deploy
        if nsenter -t 1 -m -- findmnt -M "$$HOST_MNT_BASE" >/dev/null 2>&1; then
          echo "fuse-share: $$HOST_MNT_BASE is a mountpoint — skip mkdir"
        else
          nsenter -t 1 -m -- mkdir -p "$$HOST_MNT_BASE" \
            || echo "fuse-share: WARNING could not mkdir $$HOST_MNT_BASE"
        fi
        if ! nsenter -t 1 -m -- test -x "$$bin_dir/rclone"; then
          echo "fuse-share: installing rclone to $$bin_dir/rclone"
          arch="$$(uname -m)"
          case "$$arch" in
            x86_64) rarch=amd64 ;;
            aarch64|arm64) rarch=arm64 ;;
            armv7l) rarch=arm-v7 ;;
            *) rarch=amd64 ;;
          esac
          curl -fsSL "https://downloads.rclone.org/rclone-current-linux-$${rarch}.zip" -o /tmp/rclone.zip
          unzip -oq /tmp/rclone.zip -d /tmp
          cat /tmp/rclone-*/rclone | nsenter -t 1 -m -- tee "$$bin_dir/rclone" > /dev/null
          nsenter -t 1 -m -- chmod +x "$$bin_dir/rclone"
          echo "fuse-share: rclone installed"
        else
          echo "fuse-share: rclone already at $$bin_dir/rclone"
        fi
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          nsenter -t 1 -m -- mount --make-rshared "$$mp" \
            && echo "fuse-share: rshared OK -> $$mp" \
            || echo "fuse-share: FAILED $$mp"
        done
        nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf' || true
        nsenter -t 1 -m -- sh -c '
          if command -v apt-get >/dev/null 2>&1; then
            command -v fusermount3 >/dev/null 2>&1 || (
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq fuse3
            )
          fi
          fusermount="$$(command -v fusermount3 2>/dev/null || command -v fusermount 2>/dev/null || true)"
          if [ -n "$$fusermount" ]; then
            echo "fuse-share: host fusermount=$$fusermount"
          else
            echo "fuse-share: WARNING host fusermount missing — apt install fuse3 on Coolify host"
          fi
          if grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null; then
            echo "fuse-share: user_allow_other OK in /etc/fuse.conf"
          else
            echo "fuse-share: WARNING user_allow_other missing in /etc/fuse.conf"
          fi
          ls -l /dev/fuse 2>/dev/null || echo "fuse-share: WARNING /dev/fuse missing on host"
        '
        nsenter -t 1 -m -- sh -c 'if [ -f /etc/apparmor.d/fusermount3 ]; then
          mkdir -p /etc/apparmor.d/local
          printf "%s\n" \
            "# audiobookshelf-stack fuse-share" \
            "capability dac_override," \
            "mount fstype=@{fuse_types} options=(nosuid,nodev,rw) -> /data/coolify/**/," \
            "mount fstype=@{fuse_types} options=(nosuid,nodev,ro) -> /data/coolify/**/," \
            "umount /data/coolify/**/," \
            > /etc/apparmor.d/local/fusermount3
          if command -v apparmor_parser >/dev/null 2>&1; then
            apparmor_parser -r /etc/apparmor.d/fusermount3 \
              && echo "fuse-share: apparmor fusermount3 reloaded" \
              || echo "fuse-share: WARNING apparmor reload failed"
          else
            echo "fuse-share: WARNING apparmor_parser missing"
          fi
        else
          echo "fuse-share: no host fusermount3 profile — skip apparmor local"
        fi' || true
        echo "fuse-share: done"

  rclone:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      RCLONE_HOST_SUBDIR: audiobooks
    entrypoint: ["sh", "-c"]
    command: *rclone-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -Fq \"$$HOST_MNT_BASE/$${STORAGEBOX_PATH}$${RCLONE_HOST_SUBDIR}\" /proc/1/mounts",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  rclone-podcasts:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      RCLONE_HOST_SUBDIR: podcasts
    entrypoint: ["sh", "-c"]
    command: *rclone-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -Fq \"$$HOST_MNT_BASE/$${STORAGEBOX_PATH}$${RCLONE_HOST_SUBDIR}\" /proc/1/mounts",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  rclone-ebooks:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      RCLONE_HOST_SUBDIR: ebooks
    entrypoint: ["sh", "-c"]
    command: *rclone-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -Fq \"$$HOST_MNT_BASE/$${STORAGEBOX_PATH}$${RCLONE_HOST_SUBDIR}\" /proc/1/mounts",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    # Wait for host FUSE at each bind source before starting (paths must exist as mount points)
    depends_on:
      rclone:
        condition: service_healthy
      rclone-podcasts:
        condition: service_healthy
      rclone-ebooks:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      SERVICE_URL_AUDIOBOOKSHELF: ${SERVICE_URL_AUDIOBOOKSHELF:-}
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - traefik.http.routers.audiobookshelf-http.rule=Host(`${AUDIOBOOKSHELF_HOST:?set hostname e.g. books.example.com}`)
      - traefik.http.routers.audiobookshelf-http.entrypoints=http
      - traefik.http.routers.audiobookshelf-https.rule=Host(`${AUDIOBOOKSHELF_HOST:?}`)
      - traefik.http.routers.audiobookshelf-https.entrypoints=https
      - traefik.http.routers.audiobookshelf-https.tls=true
      - traefik.http.routers.audiobookshelf-https.tls.certresolver=letsencrypt
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      # Bind each FUSE mount point directly — binding parent mnt/ shows empty dirs in container
      - type: bind
        source: ./mnt/media/audiobooks
        target: /audiobooks
        bind:
          create_host_path: false
          propagation: rslave
      - type: bind
        source: ./mnt/media/podcasts
        target: /podcasts
        bind:
          create_host_path: false
          propagation: rslave
      - type: bind
        source: ./mnt/media/ebooks
        target: /ebooks
        bind:
          create_host_path: false
          propagation: rslave

volumes:
  abs_config:
  abs_metadata:
