# Coolify-compatible stack: Storage Box FUSE mount (SFTP) + Audiobookshelf.
#
# In Coolify:
#   Build Pack: Docker Compose
#   Docker Compose Location: /compose.coolify.storagebox.yml
#   Assign your domain to the "audiobookshelf" service
#   Set STORAGEBOX_HOST / STORAGEBOX_USER / STORAGEBOX_PASS (plain password)
#
# In Audiobookshelf → Settings → Libraries → Add Library, use folder:
#   /audiobooks   (books)
#   /podcasts     (podcasts)
#   /ebooks       (ebooks)
#
# Create those directories on the Storage Box first (under STORAGEBOX_PATH).
# Host FUSE share fix if folders look empty: sudo mount --make-rshared /data/coolify

x-rclone-env: &rclone-env
  RCLONE_CONFIG_HETZNER_TYPE: sftp
  RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
  RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
  STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
  STORAGEBOX_PATH: ${STORAGEBOX_PATH:-}
  RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
  RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
  RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
  RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
  VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
  VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
  VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
  VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-security: &rclone-security
  privileged: true
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined

services:
  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: audiobooks
      RCLONE_MOUNT_PATH: /mnt/audiobooks
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    volumes:
      - rclone_cache:/cache
      - type: bind
        source: ./mnt/audiobooks
        target: /mnt/audiobooks
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/audiobooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-podcasts:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: podcasts
      RCLONE_MOUNT_PATH: /mnt/podcasts
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    volumes:
      - rclone_cache_podcasts:/cache
      - type: bind
        source: ./mnt/podcasts
        target: /mnt/podcasts
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/podcasts ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-ebooks:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ebooks
      RCLONE_MOUNT_PATH: /mnt/ebooks
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    volumes:
      - rclone_cache_ebooks:/cache
      - type: bind
        source: ./mnt/ebooks
        target: /mnt/ebooks
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/ebooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        read_only: true
        bind:
          propagation: rshared
        is_directory: true
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        read_only: true
        bind:
          propagation: rshared
        is_directory: true
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        read_only: true
        bind:
          propagation: rshared
        is_directory: true

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
