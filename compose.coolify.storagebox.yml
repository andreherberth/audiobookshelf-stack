# Coolify + Storage Box (SFTP FUSE) + Audiobookshelf
#
# Host-namespace FUSE (nsenter) so ABS binds see Storage Box — not a local
# VPS folder. Requires privileged + pid:host + /dev/fuse.
#
# Coolify Advanced: enable **Raw Compose Deployment** (needed for FUSE).
# Domains UI is limited in Raw mode — set AUDIOBOOKSHELF_HOST (hostname only)
# for Traefik labels, e.g. books.example.com or xxx.sslip.io.
#
# Required env:
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain password)
#   HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt
#   AUDIOBOOKSHELF_HOST=your.domain.or.sslip.io
# Optional:
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
#
# Volume sources are literal ./mnt/... (Coolify rejects ${...} in sources).
#
# One-time on the Coolify host:
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
#   grep -q user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf

x-rclone-common: &rclone-common
  # alpine (not rclone/rclone) — reliable apk, fewer Docker Hub pulls
  image: alpine:3.20
  restart: unless-stopped
  privileged: true
  pid: host
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  environment: &rclone-env
    RCLONE_CONFIG_HETZNER_TYPE: sftp
    RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
    RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
    STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
    STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
    HOST_MNT_BASE: ${HOST_MNT_BASE:?set to /data/coolify/applications/<uuid>/mnt}
    RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
    RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
    RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
    RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    RCLONE_CONFIG_HETZNER_KNOWN_HOSTS_FILE: none
    VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
    VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
    VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
    VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-health: &rclone-health
  interval: 15s
  timeout: 10s
  retries: 40
  start_period: 180s

# Install rclone once per container, mount onto the Coolify host path.
x-rclone-host-mount: &rclone-host-mount
  - |
    set -eu
    echo "rclone: starting host-mount setup (subdir=$$RCLONE_HOST_SUBDIR)"
    if [ ! -e /dev/fuse ]; then
      echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
      exit 1
    fi
    apk add --no-cache util-linux fuse3 curl unzip ca-certificates >/dev/null
    echo "user_allow_other" > /etc/fuse.conf
    nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf' \
      || echo "rclone: WARNING could not update host fuse.conf"

    arch="$$(uname -m)"
    case "$$arch" in
      x86_64) rarch=amd64 ;;
      aarch64|arm64) rarch=arm64 ;;
      armv7l) rarch=arm-v7 ;;
      *) rarch=amd64 ;;
    esac
    if [ ! -x /usr/local/bin/rclone ]; then
      echo "rclone: downloading rclone linux-$$rarch"
      curl -fsSL "https://downloads.rclone.org/rclone-current-linux-$${rarch}.zip" -o /tmp/rclone.zip
      unzip -oq /tmp/rclone.zip -d /tmp
      mv /tmp/rclone-*/rclone /usr/local/bin/rclone
      chmod +x /usr/local/bin/rclone
    fi

    export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
    remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
    host_path="$${HOST_MNT_BASE}/$${RCLONE_HOST_SUBDIR}"
    app_dir="$$(dirname "$$HOST_MNT_BASE")"
    cache_dir="$${app_dir}/rclone-cache/$${RCLONE_HOST_SUBDIR}"
    bin_dir="$${app_dir}/bin"
    my_pid=$$

    echo "rclone: remote=$$remote"
    echo "rclone: host_path=$$host_path"

    set +e
    probe_out="$$(rclone lsf "$$remote" --max-depth 1 2>&1)"
    probe_rc=$$?
    set -e
    echo "$$probe_out" | head -n 40
    if [ "$$probe_rc" -ne 0 ]; then
      echo "rclone: FATAL cannot access $$remote — check STORAGEBOX_* and remote folder names"
      exit 1
    fi
    rclone mkdir "$$remote" 2>/dev/null || true

    nsenter -t 1 -m -- mkdir -p "$$host_path" "$$cache_dir" "$$bin_dir"
    nsenter -t 1 -m -- cp "/proc/$${my_pid}/root/usr/local/bin/rclone" "$${bin_dir}/rclone"
    nsenter -t 1 -m -- chmod +x "$${bin_dir}/rclone"

    if nsenter -t 1 -m -- findmnt -M "$$host_path" >/dev/null 2>&1; then
      echo "rclone: unmounting stale FUSE at $$host_path"
      nsenter -t 1 -m -- fusermount3 -uz "$$host_path" 2>/dev/null \
        || nsenter -t 1 -m -- fusermount -uz "$$host_path" 2>/dev/null \
        || nsenter -t 1 -m -- umount -l "$$host_path" 2>/dev/null \
        || true
      sleep 1
    fi
    if [ -n "$$(nsenter -t 1 -m -- ls -A "$$host_path" 2>/dev/null || true)" ]; then
      echo "rclone: clearing local shadow files under $$host_path"
      nsenter -t 1 -m -- find "$$host_path" -mindepth 1 -delete
    fi

    echo "rclone: HOST mounting $$remote -> $$host_path"
    exec nsenter -t 1 -m -n -- "$${bin_dir}/rclone" mount "$$remote" "$$host_path" \
      --allow-other \
      --allow-non-empty \
      --vfs-cache-mode "$$VFS_CACHE_MODE" \
      --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
      --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
      --cache-dir "$$cache_dir" \
      --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
      --checkers 2 \
      --log-level INFO

services:
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          nsenter -t 1 -m -- mount --make-rshared "$$mp" \
            && echo "fuse-share: rshared OK -> $$mp" \
            || echo "fuse-share: FAILED $$mp"
        done
        nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf'
        echo "fuse-share: done"

  rclone:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      RCLONE_HOST_SUBDIR: audiobooks
    entrypoint: ["sh", "-c"]
    command: *rclone-host-mount
    healthcheck:
      <<: *rclone-health
      # pid:host → /proc/1/mounts is the host; no nsenter needed in the probe
      test:
        [
          "CMD-SHELL",
          "grep -F \"$$HOST_MNT_BASE/audiobooks\" /proc/1/mounts",
        ]

  rclone-podcasts:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      RCLONE_HOST_SUBDIR: podcasts
    entrypoint: ["sh", "-c"]
    command: *rclone-host-mount
    healthcheck:
      <<: *rclone-health
      test:
        [
          "CMD-SHELL",
          "grep -F \"$$HOST_MNT_BASE/podcasts\" /proc/1/mounts",
        ]

  rclone-ebooks:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      RCLONE_HOST_SUBDIR: ebooks
    entrypoint: ["sh", "-c"]
    command: *rclone-host-mount
    healthcheck:
      <<: *rclone-health
      test:
        [
          "CMD-SHELL",
          "grep -F \"$$HOST_MNT_BASE/ebooks\" /proc/1/mounts",
        ]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    # Only wait for audiobooks mount — podcasts/ebooks must not block deploy
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      SERVICE_URL_AUDIOBOOKSHELF: ${SERVICE_URL_AUDIOBOOKSHELF:-}
    expose:
      - "80"
    # Raw Compose: Coolify Domains UI may be hidden — Traefik via AUDIOBOOKSHELF_HOST
    labels:
      - traefik.enable=true
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - traefik.http.routers.audiobookshelf-http.rule=Host(`${AUDIOBOOKSHELF_HOST:?set hostname e.g. books.example.com}`)
      - traefik.http.routers.audiobookshelf-http.entrypoints=http
      - traefik.http.routers.audiobookshelf-https.rule=Host(`${AUDIOBOOKSHELF_HOST:?}`)
      - traefik.http.routers.audiobookshelf-https.entrypoints=https
      - traefik.http.routers.audiobookshelf-https.tls=true
      - traefik.http.routers.audiobookshelf-https.tls.certresolver=letsencrypt
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        bind:
          propagation: rshared

volumes:
  abs_config:
  abs_metadata:
