# Coolify + Storage Box: host-visible FUSE mounts for Audiobookshelf.
#
# Why previous setups failed:
#   Mounting FUSE on a separate container path (./mnt/audiobooks) often does NOT
#   show up in ABS — Coolify/Docker keep that bind private. ABS then writes to a
#   local VPS folder while rclone talks to the Storage Box.
#
# Fix:
#   1) make-rshared on the real mountpoint covering /data/coolify
#   2) bind /data/coolify:rshared into rclone
#   3) rclone mount *under* that bind (…/applications/<uuid>/mnt/audiobooks)
#   4) ABS binds the same host dirs — sees Storage Box read+write
#
# Coolify env:
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain)
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
#   Optional: HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt
#
# Before first working deploy, clear local shadow files:
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#
# ABS libraries: /audiobooks /podcasts /ebooks

services:
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    exclude_from_hc: true
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          if nsenter -t 1 -m -- mount --make-rshared "$$mp"; then
            echo "fuse-share: rshared OK -> $$mp (via $$probe)"
          else
            echo "fuse-share: FAILED make-rshared $$mp"
          fi
        done

  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    privileged: true
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
      STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
      STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
      STORAGEBOX_AUDIOBOOKS_DIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      STORAGEBOX_PODCASTS_DIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      STORAGEBOX_EBOOKS_DIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      HOST_MNT_BASE: ${HOST_MNT_BASE:-}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
      RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
      RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
      RCLONE_CONFIG_HETZNER_KNOWN_HOSTS_FILE: none
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
      VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
      VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
      VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    # Mount UNDER this shared bind so FUSE is visible on the Coolify host paths.
    volumes:
      - rclone_cache:/cache
      - /data/coolify:/data/coolify:rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null 2>&1 || true
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"

        if [ -n "$$HOST_MNT_BASE" ]; then
          BASE="$$HOST_MNT_BASE"
        else
          BASE="$$(find /data/coolify/applications -type d -path '*/mnt' 2>/dev/null | head -n 1 || true)"
        fi
        if [ -z "$$BASE" ] || [ ! -d "$$BASE" ]; then
          echo "rclone: ERROR could not find …/mnt under /data/coolify/applications"
          echo "rclone: set HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt"
          ls -la /data/coolify/applications || true
          exit 1
        fi
        echo "rclone: using HOST mnt base $$BASE"
        mkdir -p "$$BASE/audiobooks" "$$BASE/podcasts" "$$BASE/ebooks"

        is_mounted() {
          grep -q " $$1 " /proc/mounts
        }

        mount_one() {
          subdir="$$1"
          remote_dir="$$2"
          target="$$BASE/$$subdir"
          remote="hetzner:$${STORAGEBOX_PATH}$$remote_dir"
          echo "rclone: listing $$remote"
          rclone lsf "$$remote" --max-depth 2 2>&1 | head -n 30 \
            || echo "rclone: WARNING empty/missing $$remote"
          if [ -n "$$(ls -A "$$target" 2>/dev/null || true)" ] && ! is_mounted "$$target"; then
            echo "rclone: ERROR $$target has local VPS files (not FUSE)."
            echo "rclone: on the host run:"
            echo "  sudo find $$target -mindepth 1 -delete"
            exit 1
          fi
          echo "rclone: mounting $$remote -> $$target"
          rclone mount "$$remote" "$$target" \
            --allow-other \
            --vfs-cache-mode "$$VFS_CACHE_MODE" \
            --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
            --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
            --cache-dir "/cache/$$subdir" \
            --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
            --checkers 2 \
            --log-level INFO &
        }

        mount_one audiobooks "$$STORAGEBOX_AUDIOBOOKS_DIR"
        mount_one podcasts "$$STORAGEBOX_PODCASTS_DIR"
        mount_one ebooks "$$STORAGEBOX_EBOOKS_DIR"

        echo "rclone: waiting for mounts"
        for i in $$(seq 1 90); do
          ok=1
          for d in audiobooks podcasts ebooks; do
            is_mounted "$$BASE/$$d" || ok=0
          done
          [ "$$ok" = 1 ] && break
          sleep 1
        done
        for d in audiobooks podcasts ebooks; do
          if ! is_mounted "$$BASE/$$d"; then
            echo "rclone: ERROR mount failed for $$BASE/$$d"
            exit 1
          fi
          echo "rclone: OK $$BASE/$$d -> $$(ls "$$BASE/$$d" | wc -l) entries"
        done

        cleanup() {
          for d in audiobooks podcasts ebooks; do
            fusermount3 -uz "$$BASE/$$d" 2>/dev/null || fusermount -uz "$$BASE/$$d" 2>/dev/null || true
          done
        }
        trap cleanup EXIT INT TERM
        while true; do
          for d in audiobooks podcasts ebooks; do
            is_mounted "$$BASE/$$d" || exit 1
          done
          sleep 30
        done
    healthcheck:
      test: ["CMD-SHELL", "grep -q 'mnt/audiobooks' /proc/mounts"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      # Same host dirs rclone FUSE-mounted under /data/coolify/.../mnt/*
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        is_directory: true
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        is_directory: true
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        is_directory: true

volumes:
  rclone_cache:
  abs_config:
  abs_metadata:
