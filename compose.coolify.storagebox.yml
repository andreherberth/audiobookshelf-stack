# Coolify + Storage Box (SFTP FUSE) + Audiobookshelf
#
# Critical Coolify setting: enable "Raw Compose Deployment" if FUSE still
# gets Permission denied (Coolify may strip privileged/devices/security_opt).
#
# Required env:
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain password)
#   HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt
# Optional:
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
#
# One-time on the Coolify host:
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find "$HOST_MNT_BASE" -mindepth 1 -delete
#   grep -q user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
#
# ABS libraries: /audiobooks /podcasts /ebooks

x-rclone-common: &rclone-common
  image: rclone/rclone:latest
  restart: unless-stopped
  privileged: true
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  environment: &rclone-env
    RCLONE_CONFIG_HETZNER_TYPE: sftp
    RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
    RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
    STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
    STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
    HOST_MNT_BASE: ${HOST_MNT_BASE:?}
    RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
    RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
    RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
    RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    RCLONE_CONFIG_HETZNER_KNOWN_HOSTS_FILE: none
    VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
    VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
    VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
    VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

services:
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    exclude_from_hc: true
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          nsenter -t 1 -m -- mount --make-rshared "$$mp" \
            && echo "fuse-share: rshared OK -> $$mp" \
            || echo "fuse-share: FAILED $$mp"
        done
        nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf'
        echo "fuse-share: done"

  rclone:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
    volumes:
      - rclone_cache:/cache
      # Long syntax avoids Compose parsing ${VAR}/path:target:mode as broken ::
      - type: bind
        source: ${HOST_MNT_BASE:?}/audiobooks
        target: /mnt/audiobooks
        bind:
          propagation: rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: listing $$remote"
        rclone lsf "$$remote" --max-depth 2 2>&1 | head -n 40 \
          || echo "rclone: WARNING could not list $$remote"
        if [ -n "$$(ls -A /mnt/audiobooks 2>/dev/null || true)" ]; then
          echo "rclone: ERROR /mnt/audiobooks has local VPS files. On the host run:"
          echo "  sudo find $$HOST_MNT_BASE/audiobooks -mindepth 1 -delete"
          exit 1
        fi
        echo "rclone: mounting $$remote -> /mnt/audiobooks"
        exec rclone mount "$$remote" /mnt/audiobooks \
          --allow-other \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/audiobooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-podcasts:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
    volumes:
      - rclone_cache_podcasts:/cache
      - type: bind
        source: ${HOST_MNT_BASE:?}/podcasts
        target: /mnt/podcasts
        bind:
          propagation: rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        rclone mkdir "$$remote" 2>/dev/null || true
        echo "rclone: mounting $$remote -> /mnt/podcasts"
        exec rclone mount "$$remote" /mnt/podcasts \
          --allow-other \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/podcasts ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-ebooks:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
    volumes:
      - rclone_cache_ebooks:/cache
      - type: bind
        source: ${HOST_MNT_BASE:?}/ebooks
        target: /mnt/ebooks
        bind:
          propagation: rshared
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        rclone mkdir "$$remote" 2>/dev/null || true
        echo "rclone: mounting $$remote -> /mnt/ebooks"
        exec rclone mount "$$remote" /mnt/ebooks \
          --allow-other \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/ebooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ${HOST_MNT_BASE:?}/audiobooks
        target: /audiobooks
        bind:
          propagation: rshared
      - type: bind
        source: ${HOST_MNT_BASE:?}/podcasts
        target: /podcasts
        bind:
          propagation: rshared
      - type: bind
        source: ${HOST_MNT_BASE:?}/ebooks
        target: /ebooks
        bind:
          propagation: rshared

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
