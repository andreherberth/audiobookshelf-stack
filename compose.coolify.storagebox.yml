# Coolify + Storage Box (SFTP FUSE) + Audiobookshelf
#
# WHY HOST MOUNTS: mounting FUSE only inside the rclone container often leaves
# Audiobookshelf on a local VPS bind (uploads appear in ABS, never on the box).
# These services mount onto the Coolify host path via nsenter so ABS binds see
# the same FUSE filesystem.
#
# Required env (Coolify UI):
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain password)
#   HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt
# Optional:
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
#   SERVICE_URL_AUDIOBOOKSHELF — Coolify Domains / temporary URL
#
# Volume sources stay literal ./mnt/... (Coolify rejects ${...} in sources).
# HOST_MNT_BASE is used only in entrypoints (allowed).
#
# Leave "Raw Compose Deployment" OFF for Domains UI. Enable only if /dev/fuse
# is missing or fusermount is denied.
#
# One-time on the Coolify host:
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
#   grep -q user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf
#
# ABS libraries: /audiobooks /podcasts /ebooks

x-rclone-common: &rclone-common
  image: rclone/rclone:latest
  restart: unless-stopped
  privileged: true
  pid: host
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  environment: &rclone-env
    RCLONE_CONFIG_HETZNER_TYPE: sftp
    RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
    RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
    STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
    STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
    # Absolute Coolify app mnt path — required for host-namespace FUSE
    HOST_MNT_BASE: ${HOST_MNT_BASE:?set to /data/coolify/applications/<uuid>/mnt}
    RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
    RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
    RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
    RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    RCLONE_CONFIG_HETZNER_KNOWN_HOSTS_FILE: none
    VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
    VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
    VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
    VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-health: &rclone-health
  interval: 10s
  timeout: 8s
  retries: 30
  start_period: 120s

x-rclone-host-mount: &rclone-host-mount
  - |
    set -eu
    echo "user_allow_other" > /etc/fuse.conf
    if [ ! -e /dev/fuse ]; then
      echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
      exit 1
    fi
    apk add --no-cache util-linux fuse3 >/dev/null
    nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf'

    export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
    remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
    host_path="$${HOST_MNT_BASE}/$${RCLONE_HOST_SUBDIR}"
    app_dir="$$(dirname "$$HOST_MNT_BASE")"
    cache_dir="$${app_dir}/rclone-cache/$${RCLONE_HOST_SUBDIR}"
    bin_dir="$${app_dir}/bin"
    my_pid=$$
    rclone_src="$$(command -v rclone)"

    echo "rclone: remote=$$remote host_path=$$host_path"

    set +e
    probe_out="$$(rclone lsf "$$remote" --max-depth 1 2>&1)"
    probe_rc=$$?
    set -e
    echo "$$probe_out" | head -n 40
    if [ "$$probe_rc" -ne 0 ]; then
      echo "rclone: FATAL cannot access $$remote — check STORAGEBOX_* credentials/paths"
      exit 1
    fi
    rclone mkdir "$$remote" 2>/dev/null || true

    nsenter -t 1 -m -- mkdir -p "$$host_path" "$$cache_dir" "$$bin_dir"
    nsenter -t 1 -m -- cp "/proc/$${my_pid}/root$${rclone_src}" "$${bin_dir}/rclone"
    nsenter -t 1 -m -- chmod +x "$${bin_dir}/rclone"

    # Drop stale host mount, then clear VPS-only shadow files (not on Storage Box)
    if nsenter -t 1 -m -- findmnt -M "$$host_path" >/dev/null 2>&1; then
      echo "rclone: unmounting stale FUSE at $$host_path"
      nsenter -t 1 -m -- fusermount3 -uz "$$host_path" 2>/dev/null \
        || nsenter -t 1 -m -- umount -l "$$host_path" 2>/dev/null \
        || true
    fi
    if [ -n "$$(nsenter -t 1 -m -- ls -A "$$host_path" 2>/dev/null || true)" ]; then
      echo "rclone: clearing local shadow files under $$host_path"
      nsenter -t 1 -m -- find "$$host_path" -mindepth 1 -delete
    fi

    echo "rclone: HOST mounting $$remote -> $$host_path (visible to ABS binds)"
    # -m: host mounts; -n: host network for SFTP
    exec nsenter -t 1 -m -n -- "$${bin_dir}/rclone" mount "$$remote" "$$host_path" \
      --allow-other \
      --allow-non-empty \
      --vfs-cache-mode "$$VFS_CACHE_MODE" \
      --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
      --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
      --cache-dir "$$cache_dir" \
      --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
      --checkers 2 \
      --log-level INFO

services:
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          nsenter -t 1 -m -- mount --make-rshared "$$mp" \
            && echo "fuse-share: rshared OK -> $$mp" \
            || echo "fuse-share: FAILED $$mp"
        done
        nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf'
        echo "fuse-share: done"

  rclone:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      RCLONE_HOST_SUBDIR: audiobooks
    volumes:
      - rclone_cache:/cache
    entrypoint: ["sh", "-c"]
    command: *rclone-host-mount
    healthcheck:
      <<: *rclone-health
      test:
        [
          "CMD-SHELL",
          "nsenter -t 1 -m -- findmnt -M \"$$HOST_MNT_BASE/audiobooks\" >/dev/null",
        ]

  rclone-podcasts:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      RCLONE_HOST_SUBDIR: podcasts
    volumes:
      - rclone_cache_podcasts:/cache
    entrypoint: ["sh", "-c"]
    command: *rclone-host-mount
    healthcheck:
      <<: *rclone-health
      test:
        [
          "CMD-SHELL",
          "nsenter -t 1 -m -- findmnt -M \"$$HOST_MNT_BASE/podcasts\" >/dev/null",
        ]

  rclone-ebooks:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      RCLONE_HOST_SUBDIR: ebooks
    volumes:
      - rclone_cache_ebooks:/cache
    entrypoint: ["sh", "-c"]
    command: *rclone-host-mount
    healthcheck:
      <<: *rclone-health
      test:
        [
          "CMD-SHELL",
          "nsenter -t 1 -m -- findmnt -M \"$$HOST_MNT_BASE/ebooks\" >/dev/null",
        ]

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
      rclone-podcasts:
        condition: service_healthy
      rclone-ebooks:
        condition: service_healthy
    # Coolify Domains: assign / Generate Domain on this service.
    # Keep Raw Compose OFF unless FUSE is blocked.
    environment:
      TZ: ${TZ:-UTC}
      SERVICE_URL_AUDIOBOOKSHELF: ${SERVICE_URL_AUDIOBOOKSHELF:-}
    expose:
      - "80"
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      # Bind AFTER host FUSE is up (depends_on healthy) so ABS sees Storage Box
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        bind:
          propagation: rshared

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
