# Coolify-compatible stack: Storage Box FUSE mount (SFTP) + Audiobookshelf.
#
# In Coolify:
#   Build Pack: Docker Compose
#   Docker Compose Location: /compose.coolify.storagebox.yml
#   Assign domain to "audiobookshelf"
#   Env (typical for media/audiobooks layout):
#     STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain)
#     STORAGEBOX_PATH=media/
#     STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#     STORAGEBOX_PODCASTS_DIR=podcast    # use "podcasts" if that is your folder name
#     STORAGEBOX_EBOOKS_DIR=ebooks
#
# ABS libraries: /audiobooks, /podcasts, /ebooks
#
# If ABS and Storage Box stay out of sync, ABS was writing to a local folder
# instead of FUSE. The fuse-share service runs mount --make-rshared on the
# *mountpoint that covers* /data/coolify (that path itself is often not a mount).
# Manual fix on the Coolify server:
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
# Then redeploy.

x-rclone-env: &rclone-env
  RCLONE_CONFIG_HETZNER_TYPE: sftp
  RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
  RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
  STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
  STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
  RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
  RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
  RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
  RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
  RCLONE_CONFIG_HETZNER_KNOWN_HOSTS_FILE: none
  VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
  VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
  VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
  VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-security: &rclone-security
  privileged: true
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined

services:
  # /data/coolify is usually a normal directory, not a mountpoint.
  # mount --make-rshared only works on real mountpoints (often / or /data).
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    exclude_from_hc: true
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          if [ ! -e "$$probe" ]; then
            continue
          fi
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          if [ -n "$$mp" ]; then
            if nsenter -t 1 -m -- mount --make-rshared "$$mp"; then
              echo "fuse-share: rshared OK on mountpoint $$mp (from $$probe)"
            else
              echo "fuse-share: could not make-rshared $$mp (from $$probe)"
            fi
          fi
        done
        echo "fuse-share: done"

  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      RCLONE_MOUNT_PATH: /mnt/audiobooks
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    volumes:
      - rclone_cache:/cache
      - type: bind
        source: ./mnt/audiobooks
        target: /mnt/audiobooks
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/audiobooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-podcasts:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      RCLONE_MOUNT_PATH: /mnt/podcasts
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    volumes:
      - rclone_cache_podcasts:/cache
      - type: bind
        source: ./mnt/podcasts
        target: /mnt/podcasts
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/podcasts ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  rclone-ebooks:
    image: rclone/rclone:latest
    restart: unless-stopped
    <<: *rclone-security
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      RCLONE_MOUNT_PATH: /mnt/ebooks
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
        echo "rclone: mounting $$remote -> $$RCLONE_MOUNT_PATH"
        exec rclone mount "$$remote" "$$RCLONE_MOUNT_PATH" \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 2 \
          --log-level INFO
    volumes:
      - rclone_cache_ebooks:/cache
      - type: bind
        source: ./mnt/ebooks
        target: /mnt/ebooks
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/ebooks ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      # rw so uploads from ABS go to the Storage Box via FUSE (not local VPS disk)
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        bind:
          propagation: rshared
        is_directory: true
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        bind:
          propagation: rshared
        is_directory: true
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        bind:
          propagation: rshared
        is_directory: true

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
