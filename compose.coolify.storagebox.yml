# Coolify-compatible stack: Storage Box FUSE mount (SFTP) + Audiobookshelf.
#
# In Coolify:
#   Build Pack: Docker Compose
#   Docker Compose Location: /compose.coolify.storagebox.yml
#   Assign your domain to the "audiobookshelf" service
#   Set STORAGEBOX_HOST / STORAGEBOX_USER / STORAGEBOX_PASS (plain password)
#
# No Coolify "content" file binds (they often become directories and break
# mounts). fuse.conf + password obscure happen in the container entrypoint.
#
# If a previous deploy created fuse.conf/entrypoint.sh as directories, remove them:
#   rm -rf /data/coolify/applications/w2cqu8zgqq5hw35ol4fzkanb/fuse.conf \
#          /data/coolify/applications/w2cqu8zgqq5hw35ol4fzkanb/entrypoint.sh
#
# Libraries in ABS: /media/audiobooks, /media/podcasts, /media/ebooks
# Host FUSE share fix if ABS sees empty dirs: sudo mount --make-rshared /data/coolify

services:
  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    privileged: true
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
      STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
      STORAGEBOX_PATH: ${STORAGEBOX_PATH:-}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
      RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
      RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
      VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
      VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
      VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}
    entrypoint: ["sh", "-c"]
    # $$ -> $ for the container shell (Compose interpolation).
    command:
      - |
        set -eu
        echo "user_allow_other" > /etc/fuse.conf
        export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
        echo "rclone: mounting hetzner:$${STORAGEBOX_PATH} -> /mnt/media"
        exec rclone mount "hetzner:$${STORAGEBOX_PATH}" /mnt/media \
          --allow-other \
          --allow-non-empty \
          --vfs-cache-mode "$$VFS_CACHE_MODE" \
          --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
          --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
          --cache-dir /cache \
          --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
          --checkers 4 \
          --log-level INFO
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse:rwm
    security_opt:
      - apparmor:unconfined
    volumes:
      - rclone_cache:/cache
      - type: bind
        source: ./mnt/media
        target: /mnt/media
        bind:
          propagation: rshared
        is_directory: true
    healthcheck:
      test: ["CMD-SHELL", "grep -q ' /mnt/media ' /proc/mounts"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/media
        target: /media
        read_only: true
        bind:
          propagation: rshared
        is_directory: true

volumes:
  rclone_cache:
  abs_config:
  abs_metadata:
