# Coolify + Storage Box (SFTP FUSE) + Audiobookshelf
#
# Mounts FUSE on the shared /data/coolify tree (rshared) at HOST_MNT_BASE/<lib>
# so Audiobookshelf's ./mnt binds see Storage Box — not a local VPS folder.
#
# Coolify Advanced: enable **Raw Compose Deployment** if /dev/fuse is missing
# or fusermount is denied.
#
# Required env:
#   STORAGEBOX_HOST, STORAGEBOX_USER, STORAGEBOX_PASS (plain password)
#   HOST_MNT_BASE=/data/coolify/applications/<uuid>/mnt
#   AUDIOBOOKSHELF_HOST=your.domain.or.sslip.io
# Optional:
#   STORAGEBOX_PATH=media/
#   STORAGEBOX_AUDIOBOOKS_DIR=audiobooks
#   STORAGEBOX_PODCASTS_DIR=podcast
#   STORAGEBOX_EBOOKS_DIR=ebooks
#
# Volume sources must be literal (Coolify rejects ${...} in sources).
#
# One-time on the Coolify host:
#   sudo mount --make-rshared "$(findmnt -n -o TARGET -T /data/coolify)"
#   sudo find /data/coolify/applications/<uuid>/mnt -mindepth 1 -delete
#   grep -q user_allow_other /etc/fuse.conf || echo user_allow_other | sudo tee -a /etc/fuse.conf

x-rclone-common: &rclone-common
  image: rclone/rclone:1.69.1
  restart: unless-stopped
  privileged: true
  cap_add:
    - SYS_ADMIN
  devices:
    - /dev/fuse:/dev/fuse:rwm
  security_opt:
    - apparmor:unconfined
    - seccomp:unconfined
  environment: &rclone-env
    RCLONE_CONFIG_HETZNER_TYPE: sftp
    RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST:?}
    RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER:?}
    STORAGEBOX_PASS: ${STORAGEBOX_PASS:?}
    STORAGEBOX_PATH: ${STORAGEBOX_PATH:-media/}
    HOST_MNT_BASE: ${HOST_MNT_BASE:?set to /data/coolify/applications/<uuid>/mnt}
    RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
    RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
    RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
    RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
    VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
    VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
    VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}

x-rclone-mount: &rclone-mount
  - |
    set -eu
    echo "rclone: start subdir=$$RCLONE_HOST_SUBDIR"
    echo "user_allow_other" > /etc/fuse.conf
    if [ ! -e /dev/fuse ]; then
      echo "rclone: FATAL /dev/fuse missing — enable Coolify Raw Compose Deployment"
      sleep 30
      exit 1
    fi
    ls -l /dev/fuse || true

    export RCLONE_CONFIG_HETZNER_PASS="$$(rclone obscure "$$STORAGEBOX_PASS")"
    remote="hetzner:$${STORAGEBOX_PATH}$${RCLONE_REMOTE_SUBDIR}"
    host_path="$${HOST_MNT_BASE}/$${RCLONE_HOST_SUBDIR}"

    echo "rclone: remote=$$remote"
    echo "rclone: mountpoint=$$host_path"

    mkdir -p "$$host_path" /cache

    # Retry forever so Coolify can show logs (do not crash-loop exit in 5s)
    while true; do
      echo "rclone: probing $$remote"
      if ! rclone lsf "$$remote" --max-depth 1 2>&1 | head -n 40; then
        echo "rclone: probe failed — check STORAGEBOX_* / folder names; retry in 20s"
        sleep 20
        continue
      fi
      rclone mkdir "$$remote" 2>/dev/null || true

      if findmnt -M "$$host_path" >/dev/null 2>&1 || grep -Fq "$$host_path" /proc/mounts; then
        echo "rclone: unmounting stale mount at $$host_path"
        fusermount3 -uz "$$host_path" 2>/dev/null || fusermount -uz "$$host_path" 2>/dev/null || umount -l "$$host_path" 2>/dev/null || true
        sleep 1
      fi
      if [ -n "$$(ls -A "$$host_path" 2>/dev/null || true)" ]; then
        echo "rclone: clearing local shadow files under $$host_path"
        find "$$host_path" -mindepth 1 -delete
      fi

      echo "rclone: mounting $$remote -> $$host_path"
      # Foreground mount (exits only on failure)
      rclone mount "$$remote" "$$host_path" \
        --allow-other \
        --allow-non-empty \
        --vfs-cache-mode "$$VFS_CACHE_MODE" \
        --vfs-cache-max-size "$$VFS_CACHE_MAX_SIZE" \
        --vfs-cache-max-age "$$VFS_CACHE_MAX_AGE" \
        --cache-dir "/cache" \
        --dir-cache-time "$$VFS_DIR_CACHE_TIME" \
        --checkers 2 \
        --log-level INFO \
        && break
      echo "rclone: mount exited; retry in 15s"
      sleep 15
    done

services:
  fuse-share:
    image: alpine:3.20
    restart: "no"
    privileged: true
    pid: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache util-linux >/dev/null
        for probe in /data/coolify/applications /data/coolify /data /var/lib/docker /; do
          [ -e "$$probe" ] || continue
          mp="$$(nsenter -t 1 -m -- findmnt -n -o TARGET -T "$$probe" 2>/dev/null || true)"
          [ -n "$$mp" ] || continue
          nsenter -t 1 -m -- mount --make-rshared "$$mp" \
            && echo "fuse-share: rshared OK -> $$mp" \
            || echo "fuse-share: FAILED $$mp"
        done
        nsenter -t 1 -m -- sh -c 'grep -q "^user_allow_other" /etc/fuse.conf 2>/dev/null || echo user_allow_other >> /etc/fuse.conf'
        echo "fuse-share: done"

  rclone:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_AUDIOBOOKS_DIR:-audiobooks}
      RCLONE_HOST_SUBDIR: audiobooks
    volumes:
      - type: bind
        source: /data/coolify
        target: /data/coolify
        bind:
          propagation: rshared
      - rclone_cache:/cache
    entrypoint: ["sh", "-c"]
    command: *rclone-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -Fq \"$$HOST_MNT_BASE/audiobooks\" /proc/mounts",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  rclone-podcasts:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_PODCASTS_DIR:-podcast}
      RCLONE_HOST_SUBDIR: podcasts
    volumes:
      - type: bind
        source: /data/coolify
        target: /data/coolify
        bind:
          propagation: rshared
      - rclone_cache_podcasts:/cache
    entrypoint: ["sh", "-c"]
    command: *rclone-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -Fq \"$$HOST_MNT_BASE/podcasts\" /proc/mounts",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  rclone-ebooks:
    <<: *rclone-common
    depends_on:
      fuse-share:
        condition: service_completed_successfully
    environment:
      <<: *rclone-env
      RCLONE_REMOTE_SUBDIR: ${STORAGEBOX_EBOOKS_DIR:-ebooks}
      RCLONE_HOST_SUBDIR: ebooks
    volumes:
      - type: bind
        source: /data/coolify
        target: /data/coolify
        bind:
          propagation: rshared
      - rclone_cache_ebooks:/cache
    entrypoint: ["sh", "-c"]
    command: *rclone-mount
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -Fq \"$$HOST_MNT_BASE/ebooks\" /proc/mounts",
        ]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    restart: unless-stopped
    # service_started so a slow/retrying rclone does not fail the whole Coolify deploy
    depends_on:
      rclone:
        condition: service_started
    environment:
      TZ: ${TZ:-UTC}
      SERVICE_URL_AUDIOBOOKSHELF: ${SERVICE_URL_AUDIOBOOKSHELF:-}
    expose:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.services.audiobookshelf.loadbalancer.server.port=80
      - traefik.http.routers.audiobookshelf-http.rule=Host(`${AUDIOBOOKSHELF_HOST:?set hostname e.g. books.example.com}`)
      - traefik.http.routers.audiobookshelf-http.entrypoints=http
      - traefik.http.routers.audiobookshelf-https.rule=Host(`${AUDIOBOOKSHELF_HOST:?}`)
      - traefik.http.routers.audiobookshelf-https.entrypoints=https
      - traefik.http.routers.audiobookshelf-https.tls=true
      - traefik.http.routers.audiobookshelf-https.tls.certresolver=letsencrypt
    volumes:
      - abs_config:/config
      - abs_metadata:/metadata
      - type: bind
        source: ./mnt/audiobooks
        target: /audiobooks
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/podcasts
        target: /podcasts
        bind:
          propagation: rshared
      - type: bind
        source: ./mnt/ebooks
        target: /ebooks
        bind:
          propagation: rshared

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  abs_config:
  abs_metadata:
