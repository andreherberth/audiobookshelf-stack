# Quick deploy: rclone volume plugin + Audiobookshelf + Caddy.
# Requires: docker plugin install + host rclone.conf (see README).
#
# Object Storage: RCLONE_REMOTE=hetzner:${S3_BUCKET}
# Storage Box:    RCLONE_REMOTE=storagebox:  (configure [storagebox] in rclone.conf)

services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/config:/config
      - ./data/metadata:/metadata
      - type: volume
        source: s3_media
        target: /audiobooks
        volume:
          subpath: audiobooks
      - type: volume
        source: s3_media
        target: /podcasts
        volume:
          subpath: podcasts
      - type: volume
        source: s3_media
        target: /ebooks
        volume:
          subpath: ebooks
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: audiobookshelf-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      - audiobookshelf
    networks:
      - web

volumes:
  s3_media:
    driver: rclone
    driver_opts:
      remote: "${RCLONE_REMOTE:-hetzner:${S3_BUCKET}}"
      allow_other: "true"
      vfs_cache_mode: full
      no_modtime: "true"
      poll_interval: 15s
  caddy_data:
  caddy_config:

networks:
  web:
    name: audiobookshelf_web
