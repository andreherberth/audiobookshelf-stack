# Quick deploy: rclone sidecar + Audiobookshelf + Caddy.
# Podman: podman compose -f compose.yml -f podman/compose.override.yml up -d

services:
  rclone:
    image: rclone/rclone:latest
    container_name: audiobookshelf-rclone
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: s3
      RCLONE_CONFIG_HETZNER_PROVIDER: Hetzner
      RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      RCLONE_CONFIG_HETZNER_ENDPOINT: ${S3_ENDPOINT}
      RCLONE_CONFIG_HETZNER_REGION: ${S3_REGION}
    command:
      - mount
      - hetzner:${S3_BUCKET}/audiobooks
      - /mnt/audiobooks
      - --allow-other
      - --vfs-cache-mode
      - full
      - --cache-dir
      - /cache
      - --dir-cache-time
      - 72h
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - rclone_cache:/cache
      - media_audiobooks:/mnt/audiobooks:shared
    healthcheck:
      test: ["CMD", "mountpoint", "/mnt/audiobooks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - web

  rclone-podcasts:
    profiles:
      - podcasts
    image: rclone/rclone:latest
    container_name: audiobookshelf-rclone-podcasts
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: s3
      RCLONE_CONFIG_HETZNER_PROVIDER: Hetzner
      RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      RCLONE_CONFIG_HETZNER_ENDPOINT: ${S3_ENDPOINT}
      RCLONE_CONFIG_HETZNER_REGION: ${S3_REGION}
    command:
      - mount
      - hetzner:${S3_BUCKET}/podcasts
      - /mnt/podcasts
      - --allow-other
      - --vfs-cache-mode
      - full
      - --cache-dir
      - /cache
      - --dir-cache-time
      - 72h
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - rclone_cache_podcasts:/cache
      - media_podcasts:/mnt/podcasts:shared
    healthcheck:
      test: ["CMD", "mountpoint", "/mnt/podcasts"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - web

  rclone-ebooks:
    profiles:
      - ebooks
    image: rclone/rclone:latest
    container_name: audiobookshelf-rclone-ebooks
    restart: unless-stopped
    environment:
      RCLONE_CONFIG_HETZNER_TYPE: s3
      RCLONE_CONFIG_HETZNER_PROVIDER: Hetzner
      RCLONE_CONFIG_HETZNER_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      RCLONE_CONFIG_HETZNER_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      RCLONE_CONFIG_HETZNER_ENDPOINT: ${S3_ENDPOINT}
      RCLONE_CONFIG_HETZNER_REGION: ${S3_REGION}
    command:
      - mount
      - hetzner:${S3_BUCKET}/ebooks
      - /mnt/ebooks
      - --allow-other
      - --vfs-cache-mode
      - full
      - --cache-dir
      - /cache
      - --dir-cache-time
      - 72h
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    security_opt:
      - apparmor:unconfined
    volumes:
      - rclone_cache_ebooks:/cache
      - media_ebooks:/mnt/ebooks:shared
    healthcheck:
      test: ["CMD", "mountpoint", "/mnt/ebooks"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - web

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    restart: unless-stopped
    depends_on:
      rclone:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./data/config:/config
      - ./data/metadata:/metadata
      - media_audiobooks:/audiobooks:ro
      - media_podcasts:/podcasts:ro
      - media_ebooks:/ebooks:ro
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: audiobookshelf-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      - audiobookshelf
    networks:
      - web

volumes:
  rclone_cache:
  rclone_cache_podcasts:
  rclone_cache_ebooks:
  media_audiobooks:
  media_podcasts:
  media_ebooks:
  caddy_data:
  caddy_config:

networks:
  web:
    name: audiobookshelf_web
