# Storage Box (SFTP) FUSE mount overlay for the rclone sidecar stack.
# This mounts the Storage Box into Audiobookshelf — it does NOT sync/copy
# the library onto the VPS. Media stays on the Storage Box; the VPS only
# keeps ABS config/metadata plus a bounded rclone VFS cache.
#
# Requires SSH support enabled on the Storage Box in Hetzner Console.
#
# Usage:
#   docker compose -f compose.yml -f compose.storagebox.yml up -d
#   docker compose -f compose.core.yml -f compose.storagebox.yml up -d
#   docker compose -f compose.core.yml -f compose.storagebox.yml -f compose.caddy.yml up -d
#   docker compose -f compose.yml -f compose.storagebox.yml --profile podcasts --profile ebooks up -d
#
# Set STORAGEBOX_* in .env (see .env.example). STORAGEBOX_PASS must be the
# rclone-obscured password: ./scripts/obscure-password.sh 'your-password'
# Or set STORAGEBOX_KEY_PEM to an OpenSSH private key and leave the password empty.
# A rejected or blocked login sleeps (STORAGEBOX_AUTH_BACKOFF / STORAGEBOX_BAN_BACKOFF)
# instead of reconnecting on every container restart. Podcast and ebook mounts
# wait until the audiobooks mount is healthy.

x-storagebox-script: &storagebox-script
  entrypoint: !override
    - sh
    - /storagebox-mount.sh
  command: !override
    - mount-storagebox
  volumes:
    - ./scripts/storagebox-mount.sh:/storagebox-mount.sh:ro

services:
  rclone:
    <<: *storagebox-script
    environment: !override
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
      RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
      RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
      STORAGEBOX_PASS: ${STORAGEBOX_PASS:-}
      STORAGEBOX_KEY_PEM: ${STORAGEBOX_KEY_PEM:-}
      STORAGEBOX_PASS_KIND: obscured
      STORAGEBOX_MOUNT_MODE: container
      STORAGEBOX_PATH: ${STORAGEBOX_PATH:-}
      RCLONE_REMOTE_SUBDIR: audiobooks
      RCLONE_MOUNT_PATH: /mnt/audiobooks
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
      VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
      VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
      VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}
      RCLONE_CHECKERS: "4"
      STORAGEBOX_BAN_BACKOFF: ${STORAGEBOX_BAN_BACKOFF:-15m}
      STORAGEBOX_AUTH_BACKOFF: ${STORAGEBOX_AUTH_BACKOFF:-10m}
      STORAGEBOX_RETRY_DELAY: ${STORAGEBOX_RETRY_DELAY:-20s}
      STORAGEBOX_SESSION_BACKOFF: ${STORAGEBOX_SESSION_BACKOFF:-2m}

  rclone-podcasts:
    <<: *storagebox-script
    depends_on:
      rclone:
        condition: service_healthy
    environment: !override
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
      RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
      RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
      STORAGEBOX_PASS: ${STORAGEBOX_PASS:-}
      STORAGEBOX_KEY_PEM: ${STORAGEBOX_KEY_PEM:-}
      STORAGEBOX_PASS_KIND: obscured
      STORAGEBOX_MOUNT_MODE: container
      STORAGEBOX_PATH: ${STORAGEBOX_PATH:-}
      RCLONE_REMOTE_SUBDIR: podcasts
      RCLONE_MOUNT_PATH: /mnt/podcasts
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
      VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
      VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
      VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}
      RCLONE_CHECKERS: "4"
      STORAGEBOX_BAN_BACKOFF: ${STORAGEBOX_BAN_BACKOFF:-15m}
      STORAGEBOX_AUTH_BACKOFF: ${STORAGEBOX_AUTH_BACKOFF:-10m}
      STORAGEBOX_RETRY_DELAY: ${STORAGEBOX_RETRY_DELAY:-20s}
      STORAGEBOX_SESSION_BACKOFF: ${STORAGEBOX_SESSION_BACKOFF:-2m}

  rclone-ebooks:
    <<: *storagebox-script
    depends_on:
      rclone:
        condition: service_healthy
    environment: !override
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
      RCLONE_CONFIG_HETZNER_SHELL_TYPE: unix
      RCLONE_CONFIG_HETZNER_MD5SUM_COMMAND: md5 -r
      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
      STORAGEBOX_PASS: ${STORAGEBOX_PASS:-}
      STORAGEBOX_KEY_PEM: ${STORAGEBOX_KEY_PEM:-}
      STORAGEBOX_PASS_KIND: obscured
      STORAGEBOX_MOUNT_MODE: container
      STORAGEBOX_PATH: ${STORAGEBOX_PATH:-}
      RCLONE_REMOTE_SUBDIR: ebooks
      RCLONE_MOUNT_PATH: /mnt/ebooks
      VFS_CACHE_MODE: ${VFS_CACHE_MODE:-full}
      VFS_CACHE_MAX_SIZE: ${VFS_CACHE_MAX_SIZE:-2G}
      VFS_CACHE_MAX_AGE: ${VFS_CACHE_MAX_AGE:-72h}
      VFS_DIR_CACHE_TIME: ${VFS_DIR_CACHE_TIME:-72h}
      RCLONE_CHECKERS: "4"
      STORAGEBOX_BAN_BACKOFF: ${STORAGEBOX_BAN_BACKOFF:-15m}
      STORAGEBOX_AUTH_BACKOFF: ${STORAGEBOX_AUTH_BACKOFF:-10m}
      STORAGEBOX_RETRY_DELAY: ${STORAGEBOX_RETRY_DELAY:-20s}
      STORAGEBOX_SESSION_BACKOFF: ${STORAGEBOX_SESSION_BACKOFF:-2m}
