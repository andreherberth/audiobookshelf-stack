      RCLONE_CONFIG_HETZNER_SHA1SUM_COMMAND: sha1 -r
    command: !override
      - mount
      - hetzner:${STORAGEBOX_PATH:-}podcasts
      - /mnt/podcasts
      - --allow-other
      - --vfs-cache-mode
      - ${VFS_CACHE_MODE:-full}
      - --vfs-cache-max-size
      - ${VFS_CACHE_MAX_SIZE:-2G}
      - --vfs-cache-max-age
      - ${VFS_CACHE_MAX_AGE:-72h}
      - --cache-dir
      - /cache
      - --dir-cache-time
      - ${VFS_DIR_CACHE_TIME:-72h}
      - --checkers
      - "4"

  rclone-ebooks:
    environment: !override
      RCLONE_CONFIG_HETZNER_TYPE: sftp
      RCLONE_CONFIG_HETZNER_HOST: ${STORAGEBOX_HOST}
      RCLONE_CONFIG_HETZNER_USER: ${STORAGEBOX_USER}
      RCLONE_CONFIG_HETZNER_PASS: ${STORAGEBOX_PASS:-}
      RCLONE_CONFIG_HETZNER_PORT: ${STORAGEBOX_PORT:-23}
