# Caddy reverse-proxy overlay. Pairs with any core compose file that defines audiobookshelf on network "web".

services:
  caddy:
    image: caddy:2-alpine
    container_name: audiobookshelf-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      - audiobookshelf
    networks:
      - web

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    name: audiobookshelf_web
